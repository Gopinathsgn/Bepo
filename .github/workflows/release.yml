name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Needed so the release step can create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (python -c "from version import __version__; print(__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag '${{ github.ref_name }}' does not match version.py (v$version). Update version.py or the tag."
            exit 1
          }

      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "Bepo" `
            --icon "assets/icon.ico" `
            --add-data "assets;assets" `
            --add-data "config.json;." `
            --collect-binaries "moonshine_voice" `
            --exclude-module "tkinter" `
            main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # GPLv3/LGPLv3 compliance: the license texts and notices must travel with the binaries.
      - name: Add license files to the package
        run: |
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md -Destination dist\Bepo
          Copy-Item licenses -Destination dist\Bepo\licenses -Recurse

      # Downloads the model if needed, copies it into dist\Bepo\models and FAILS the build
      # if a complete model can't be bundled (so we never ship a model-less "offline" build).
      - name: Download & bundle Moonshine AI model
        run: |
          python -m setup.model_downloader dist/Bepo/models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Release gate: the packaged app must start, find the bundled model and load it.
      # (offscreen Qt so no desktop session is needed; BEPO_MUTEX_NAME avoids any lock clash)
      - name: Smoke-test the packaged app
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:BEPO_MUTEX_NAME = "Bepo_CI_Smoke_$PID"
          $log = Join-Path $env:LOCALAPPDATA 'Bepo\logs\bepo.log'
          $before = if (Test-Path $log) { @(Get-Content $log).Count } else { 0 }
          $p = Start-Process -FilePath 'dist\Bepo\Bepo.exe' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            if ((Test-Path $log) -and (Get-Content $log | Select-Object -Skip $before | Select-String 'Speech model ready')) { $ok = $true; break }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) { Get-Content $log | Select-Object -Skip $before }
          if (-not $ok) { Write-Error 'The packaged app did not reach "Speech model ready".'; exit 1 }

      - name: Package Portable ZIP
        run: |
          Compress-Archive -Path 'dist\Bepo\*' -DestinationPath 'dist\Bepo-Windows-Portable.zip' -Force

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Inno Setup Installer
        run: |
          $version = (python -c "from version import __version__; print(__version__)").Trim()
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bepo-Windows-Release
          path: |
            dist/Bepo-Setup-*.exe
            dist/Bepo-Windows-Portable.zip
          if-no-files-found: error

      - name: Publish Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Bepo-Setup-*.exe
            dist/Bepo-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
