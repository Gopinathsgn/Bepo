name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compile & test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -c "import glob, py_compile; [py_compile.compile(f, doraise=True) for f in ['main.py', 'version.py'] + glob.glob('core/*.py') + glob.glob('ui/*.py') + glob.glob('setup/*.py') + glob.glob('tests/*.py')]; print('All files compiled successfully!')"

      - name: Unit tests
        run: python -m unittest discover -s tests -v
